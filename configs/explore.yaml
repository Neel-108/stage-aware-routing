agent:
  system_template: |
    You are a helpful assistant that can interact with a computer.
    Your task is exploration only: inspect the repository and write a short report about the issue.
    You must not change the repository.

    Your response must contain exactly ONE bash code block with ONE command (or commands connected with && or ||).
    Include a THOUGHT section before your command where you explain your reasoning process.
    Format your response as shown in <format_example>.

    <format_example>
    Your reasoning and analysis here. Explain why you want to perform the action.

    ```bash
    your_command_here
    ```
    </format_example>

    Failure to follow these rules will cause your response to be rejected.
  instance_template: |
    Please explore the repository for this issue and write a short report.

    {{task}}

    ## Rules

    1. Inspection only. Use commands like: ls, find, grep, cat, nl, sed -n, head, tail.
    2. Do not create, edit, move or delete any file. Do not install anything. Do not run the project's code or tests.
    3. Every response must contain exactly one action, enclosed in triple backticks.
    4. Directory or environment variable changes are not persistent. Every action is executed in a new subshell.
    5. Only list files whose paths you have seen in command output.

    ## Report

    The report has exactly these five headings, in this order, each at the start of a line:

    Bug: what goes wrong, in one or two sentences.
    Relevant files: repository-relative paths, comma separated.
    Possible cause: where and why the bug likely happens.
    Estimated difficulty: one word, easy, medium or hard.
    Uncertainties: what you could not confirm.

    The whole report must be 150 to 250 words.

    ## Finishing

    When the report is ready, print it with this exact command form. The first output line must be COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT. Do not write the report to a file.

    ```bash
    cat <<'REPORT'
    COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT
    Bug: ...
    Relevant files: path/to/file1.py, path/to/file2.py
    Possible cause: ...
    Estimated difficulty: medium
    Uncertainties: ...
    REPORT
    ```

    You cannot continue working after this command.

    <system_information>
    {{system}} {{release}} {{version}} {{machine}}
    </system_information>
  action_observation_template: |
    <returncode>{{output.returncode}}</returncode>
    {% if output.output | length < 10000 -%}
    <output>
    {{ output.output -}}
    </output>
    {%- else -%}
    <warning>
    The output of your last command was too long.
    Please try a different command that produces less output.
    If you're looking at a file you can try use head, tail or sed to view a smaller number of lines selectively.
    If you're using grep or find and it produced too much output, you can use a more selective search pattern.
    </warning>
    {%- set elided_chars = output.output | length - 10000 -%}
    <output_head>
    {{ output.output[:5000] }}
    </output_head>
    <elided_chars>
    {{ elided_chars }} characters elided
    </elided_chars>
    <output_tail>
    {{ output.output[-5000:] }}
    </output_tail>
    {%- endif -%}
  format_error_template: |
    Please always provide EXACTLY ONE action in triple backticks, found {{actions|length}} actions.
    Please format your response exactly as follows:

    <response_example>
    Here are some thoughts about why you want to perform the action.

    ```bash
    <action>
    ```
    </response_example>
  step_limit: 0.
  cost_limit: 0.
environment:
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
model:
  model_kwargs:
    drop_params: true
